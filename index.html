<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOMIMEGEL | Official Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        .brand-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-avatar img {
            width: 80%;
            height: auto;
            object-fit: contain;
        }
        .brand-name {
            font-size: 26px;
            font-weight: bold;
            color: #212529;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .brand-subtitle {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 35px;
            font-style: italic;
        }
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #212529;
            transition: all 0.2s ease;
        }
        .link-card:hover {
            transform: translateY(-2px);
            background: #e9ecef;
        }
        .product-img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .link-text {
            font-size: 15px;
            text-align: left;
            line-height: 1.4;
            font-weight: 500;
        }
        @media (max-width: 400px) {
            .link-card {
                padding: 12px 14px;
            }
            .link-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 品牌头像 -->
        <div class="brand-avatar">
            <img src="【替换成brand_logo.jpg的Base64】" alt="AOMIMEGEL Logo">
        </div>

        <!-- 品牌名称和副标题 -->
        <div class="brand-name">AOMIMEGEL</div>
        <div class="brand-subtitle">Beautiful hair for everyone</div>

        <!-- 产品链接列表 -->
        <div class="link-list">
            <!-- 产品1：胶原蛋白发膜 -->
            <a href="https://www.amazon.com/dp/B0F6JT31R2" class="link-card" target="_blank">
                <img src="【替换成hair_mask_usa.jpg的Base64】" alt="Collagen Hair Mask" class="product-img">
                <div class="link-text">Aomimegel Collagen Hair Mask_USA</div>
            </a>

            <!-- 产品2：发膜+护发精油套装 -->
            <a href="https://www.amazon.com/dp/B0GSRQTC26" class="link-card" target="_blank">
                <img src="【替换成collagen_mask_usa.jpg的Base64】" alt="Hair Mask + Oil" class="product-img">
                <div class="link-text">Aomimegel Collagen Hair Mask + Hair Oil_USA</div>
            </a>

            <!-- 产品3：阿甘油发膜套装 -->
            <a href="https://www.amazon.com/dp/B0F6K48LRZ" class="link-card" target="_blank">
                <img src="【替换成full_set_usa.jpg的Base64】" alt="Argan Oil Hair Mask" class="product-img">
                <div class="link-text">Aomimegel Hair Mask Argan Oil Set_USA</div>
            </a>
        </div>
    </div>
</body>
</html>
