<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOMIMEGEL | Official Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            /* 极简纯白背景，清爽高级 */
            background-color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        /* 品牌头像 */
        .brand-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-avatar img {
            width: 80%;
            height: auto;
            object-fit: contain;
        }
        /* 品牌名称和副标题 */
        .brand-name {
            font-size: 26px;
            font-weight: bold;
            color: #212529;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .brand-subtitle {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 35px;
            font-style: italic;
        }
        /* 链接卡片列表 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #212529;
            transition: all 0.2s ease;
        }
        .link-card:hover {
            transform: translateY(-2px);
            background: #e9ecef;
        }
        /* 产品小图 */
        .product-img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .link-text {
            font-size: 15px;
            text-align: left;
            line-height: 1.4;
            font-weight: 500;
        }
        /* 适配移动端 */
        @media (max-width: 400px) {
            .link-card {
                padding: 12px 14px;
            }
            .link-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. 品牌头像：把括号里的内容换成你的品牌Logo图片链接 -->
        <div class="brand-avatar">
            <img src="(https://github.com/sivilayjenna-droid/Aomimegel-links/blob/main/39a37cc62b90acb232ac09c0683799a0_%E5%89%AF%E6%9C%AC.jpg?raw=true)" alt="AOMIMEGEL Logo">
        </div>

        <!-- 2. 品牌名称和副标题（已按要求写好） -->
        <div class="brand-name">AOMIMEGEL</div>
        <div class="brand-subtitle">Beautiful hair for everyone</div>

        <!-- 3. 产品链接列表（所有标题和链接已填好，仅需替换产品图片） -->
        <div class="link-list">
            <!-- 产品1：胶原蛋白发膜 -->
            <a href="https://www.amazon.com/dp/B0F6JT31R2" class="link-card" target="_blank">
                <img src="(https://github.com/sivilayjenna-droid/Aomimegel-links/blob/main/300%E5%8F%91%E8%86%9C%E4%B8%BB%E5%9B%BE.jpg?raw=true)" alt="Collagen Hair Mask" class="product-img">
                <div class="link-text">Aomimegel Collagen Hair Mask_USA</div>
            </a>

            <!-- 产品2：发膜+护发精油套装 -->
            <a href="https://www.amazon.com/dp/B0GSRQTC26" class="link-card" target="_blank">
                <img src="(https://github.com/sivilayjenna-droid/Aomimegel-links/blob/main/01-3.jpg?raw=true)" alt="Hair Mask + Oil Set" class="product-img">
                <div class="link-text">Aomimegel Collagen Hair Mask + Hair Oil_USA</div>
            </a>

            <!-- 产品3：阿甘油发膜套装 -->
            <a href="https://www.amazon.com/dp/B0F6K48LRZ" class="link-card" target="_blank">
                <img src="(https://github.com/sivilayjenna-droid/Aomimegel-links/blob/main/%E5%A4%A7%E5%A5%97%E7%9B%92%E4%B8%BB%E5%9B%BE.jpg?raw=true)" alt="Argan Oil Hair Mask Set" class="product-img">
                <div class="link-text">Aomimegel Hair Mask Argan Oil Set_USA</div>
            </a>
        </div>
    </div>
</body>
</html>
