<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOMIMEGEL | Official Links</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f2ee;
      padding: 40px 20px;
      color: #212529;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }

    .brand-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 15px;
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .brand-subtitle {
      font-size: 16px;
      color: #6c757d;
      margin-bottom: 35px;
      font-style: italic;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      min-height: 68px;
      background: #f8f9fa;
      border: 1px solid rgba(33, 37, 41, 0.08);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 8px 24px rgba(33, 37, 41, 0.08);
      outline: none;
    }

    .product-img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .walmart-icon {
      display: block;
    }

    .shopify-icon {
      display: block;
    }

    .link-text {
      font-size: 15px;
      text-align: left;
      line-height: 1.4;
      font-weight: 500;
    }

    @media (max-width: 400px) {
      body {
        padding: 28px 16px;
      }

      .link-card {
        padding: 12px 14px;
      }

      .link-text {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="brand-avatar">
      <img src="brand_logo%20.jpg" alt="AOMIMEGEL Logo">
    </div>

    <h1 class="brand-name">AOMIMEGEL</h1>
    <p class="brand-subtitle">Official Links</p>

    <div class="link-list">
      <a href="https://www.amazon.com/dp/B0F6JT31R2" class="link-card" target="_blank" rel="noopener noreferrer">
        <img src="hair_mask_usa.jpg" alt="Aomimegel Collagen Hair Mask" class="product-img">
        <div class="link-text">Aomimegel Collagen Hair Mask_USA</div>
      </a>

      <a href="https://www.amazon.com/dp/B0GSRQTC26" class="link-card" target="_blank" rel="noopener noreferrer">
        <img src="collagen_mask_usa.jpg" alt="Aomimegel Collagen Hair Mask + Hair Oil" class="product-img">
        <div class="link-text">Aomimegel Collagen Hair Mask + Hair Oil_USA</div>
      </a>

      <a href="https://www.amazon.com/dp/B0F6K48LRZ" class="link-card" target="_blank" rel="noopener noreferrer">
        <img src="full_set_usa.jpg" alt="Aomimegel Hair Mask Argan Oil Set" class="product-img">
        <div class="link-text">Aomimegel Hair Mask Argan Oil Set_USA</div>
      </a>

      <a href="https://www.walmart.com/browse/beauty/deep-conditioner/aomimegel/1085666_3147628_4555747_3165630/YnJhbmQ6QW9taW1lZ2Vs" class="link-card" target="_blank" rel="noopener noreferrer">
        <svg class="product-img walmart-icon" viewBox="0 0 40 40" role="img" aria-label="Walmart">
          <rect width="40" height="40" rx="8" fill="#0071ce"/>
          <g fill="#ffc220" transform="translate(20 20)">
            <rect x="-1.7" y="-15.5" width="3.4" height="8.8" rx="1.7"/>
            <rect x="-1.7" y="-15.5" width="3.4" height="8.8" rx="1.7" transform="rotate(60)"/>
            <rect x="-1.7" y="-15.5" width="3.4" height="8.8" rx="1.7" transform="rotate(120)"/>
            <rect x="-1.7" y="-15.5" width="3.4" height="8.8" rx="1.7" transform="rotate(180)"/>
            <rect x="-1.7" y="-15.5" width="3.4" height="8.8" rx="1.7" transform="rotate(240)"/>
            <rect x="-1.7" y="-15.5" width="3.4" height="8.8" rx="1.7" transform="rotate(300)"/>
          </g>
        </svg>
        <div class="link-text">Aomimegel Walmart Shop_USA</div>
      </a>

      <a href="https://aomimegel.com/" class="link-card" target="_blank" rel="noopener noreferrer">
        <svg class="product-img shopify-icon" viewBox="0 0 40 40" role="img" aria-label="Shopify">
          <rect width="40" height="40" rx="8" fill="#f4f7ef"/>
          <path d="M11 13.5 28.5 11l2.8 22-19.1 2z" fill="#95bf47"/>
          <path d="M15.2 14.1c.2-4.3 2.2-7.1 5.2-7.1 2.5 0 4.1 2.1 4.5 5.5" fill="none" stroke="#5e8e3e" stroke-width="2" stroke-linecap="round"/>
          <path d="M23.9 17.2c-1-.5-2-.7-2.9-.6-2.3.2-2.4 1.7-2.4 2 0 .7.5 1.1 1.8 1.8 1.8.9 3 1.9 3 3.8 0 2.7-2.1 4.8-5.3 5.1-1.6.1-3.1-.2-4.1-.9l.8-2.7c1 .6 2.2.9 3.2.8.9-.1 1.5-.6 1.5-1.3 0-.6-.4-1.1-1.6-1.7-1.5-.8-3.2-1.8-3.2-4 0-2.6 1.9-5.1 5.9-5.4 1.5-.1 2.8.2 3.7.7z" fill="#fff"/>
        </svg>
        <div class="link-text">Aomimegel Shopify Shop_USA</div>
      </a>
    </div>
  </main>
</body>
</html>
